<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="100%" height="100%">
  <defs>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="45%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <g transform="translate(8.5, 1.5)">
    <!-- Sprout Leaves on top of bubble -->
    <g transform="translate(13, 1)">
      <!-- Left Leaf -->
      <path d="M 23 16 C 14 12 9 3 18 0 C 23 8 25 13 23 16 Z" fill="#22C55E"/>
      <!-- Right Leaf -->
      <path d="M 25 16 C 34 11 40 1 31 0 C 26 7 24 12 25 16 Z" fill="#15803D"/>
    </g>

    <!-- Chat Bubble Rounded Base -->
    <g transform="translate(2, 17)">
      <rect x="0" y="0" width="48" height="46" rx="14" fill="url(#bubbleGrad)"/>
      <!-- Bubble Pointer (Tail) -->
      <path d="M 8 42 L 12 50 L 19 43 Z" fill="#15803D"/>
      <!-- Contour farm lines in crisp white -->
      <path d="M 8 20 C 18 16 28 22 38 16" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none"/>
      <path d="M 7 28 C 17 24 30 30 39 23" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none"/>
      <path d="M 7 36 C 15 31 31 37 39 30" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
